# Maven Wrapper — pins the build to one Maven version for everyone, including CI.
#
# distributionType=only-script means mvnw downloads and unpacks the Maven distribution itself,
# so no maven-wrapper.jar is committed. One less binary in the repo to review or explain, which
# matters for a library heading to Maven Central.
#
# distributionSha256Sum is verified by mvnw on every download. Without it the wrapper trusts
# whatever the URL returns. Derived from the published .sha512 for 3.9.16 (verified 2026-07-18).
# If you bump distributionUrl you MUST update this hash or the build will fail closed.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo1.maven.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
distributionSha256Sum=5af3b743dd8b876b5c45da33b676251e5f1687712644abb4ee519ca56e1d89ce
