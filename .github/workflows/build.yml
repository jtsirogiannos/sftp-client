# The default signal: every push and pull request, the whole reactor.
#
# Deliberately NOT split per domain (core / quarkus / spring). Each domain workflow would have to
# build the api, core and providers first via -am, so three workflows would roughly double runner
# time for the same signal, and the long pole — the core — would sit in all three. Failure
# attribution comes from separate *jobs*, which is what the tck matrix below is for. Separate
# workflow files are reserved for genuinely different triggers: see native.yml, compat.yml,
# release.yml.
name: build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # verify, not test: the Quarkus integration-tests module runs its @QuarkusIntegrationTest
      # suite in the integration-test phase, which `test` never reaches.
      - run: ./mvnw -B verify

  tck:
    name: tck (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [ jsch, mina ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # The TCK is the point of the SPI, so run it per provider rather than letting the aggregate
      # build hide which backend failed. Docker is present on the runner, so the containerised
      # OpenSSH fixture runs too and each provider is checked against two independent servers.
      - run: ./mvnw -B -pl sftp-provider-${{ matrix.provider }} -am test
