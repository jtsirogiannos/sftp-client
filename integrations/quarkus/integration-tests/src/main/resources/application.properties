# The endpoint has to be declared here, not injected by the test resource, because the extension
# discovers endpoint NAMES during augmentation - that is what decides how many beans exist. Config
# that only appears at runtime would produce an application with no clients at all.
#
# The port is the exception: it is unknowable until the fixture server binds one, so it is a
# placeholder overridden at runtime by EmbeddedSftpServerResource. Everything else is static.
sftp.endpoints.it.provider=mina
sftp.endpoints.it.host=localhost
sftp.endpoints.it.port=22
sftp.endpoints.it.username=tck
sftp.endpoints.it.password=tck-password

# The fixture regenerates its host key on every start, so there is nothing stable to pin. Correct
# here and nowhere else - the name is meant to be uncomfortable.
sftp.endpoints.it.host-key-strategy=INSECURE_ACCEPT_ANY

# A second endpoint, multi-tenant: every tenant confined to its own directory on the same server,
# the tenant read from the X-Tenant header by HeaderTenantResolver. One connection, so a request
# whose calls did not share its @WithSftpSession session would wait for itself and time out.
sftp.endpoints.partners.provider=mina
sftp.endpoints.partners.host=localhost
sftp.endpoints.partners.port=22
sftp.endpoints.partners.username=tck
sftp.endpoints.partners.password=tck-password
sftp.endpoints.partners.host-key-strategy=INSECURE_ACCEPT_ANY
sftp.endpoints.partners.pool.max-size=1
sftp.endpoints.partners.pool.acquire-timeout=PT2S
sftp.endpoints.partners.tenancy.enabled=true
sftp.endpoints.partners.tenancy.root-directory=/upload/tenants/{tenant}
